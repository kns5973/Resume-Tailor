[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Agentic system that builds a verified, evidence-grounded LaTeX resume tailored to a job description."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "requests>=2.31",  # GitHub snapshot fetch + Groq LLM calls
]

# Phase-scoped groups: install only what a phase needs.
#   Phase 0:   pip install -e ".[dev]"
#   Phase 1:   pip install -e ".[phase1]"   (adds ingestion + retrieval; pulls torch)
[project.optional-dependencies]
dev = ["pytest>=8"]
phase1 = [
    "pygithub>=2.3",               # GitHub REST API (structured data, no scraping)
    "pdfplumber>=0.11",            # old-resume / PDF export parsing
    "trafilatura>=1.10",           # JD URL scraping (only input that needs it)
    "pytesseract>=0.3.10",         # cert OCR (also needs tesseract-ocr system binary)
    "chromadb>=0.5",               # vector store (in-memory / local file)
    "sentence-transformers>=3.0",  # all-MiniLM-L6-v2 embeddings (heavy: pulls torch)
]
web = [
    "fastapi>=0.110",  # Phase 6 frontend API (resume_tailor/web.py)
    "uvicorn>=0.29",   # ASGI server: python -m resume_tailor.web
    "httpx>=0.27",     # FastAPI TestClient
    # Runtime requirements of the web app itself: chromadb is imported at app
    # boot (collector.vector_store) and sentence-transformers when a job runs
    # (collector.embed). Without these, `python -m resume_tailor.web` fails.
    # chromadb pinned to 1.x (the version the client code + batch caps are
    # validated against).
    "chromadb>=1.0",
    "sentence-transformers>=3.0",  # pulls torch
]

[tool.setuptools.package-data]
resume_tailor = ["static/*"]

[tool.setuptools.packages.find]
include = ["resume_tailor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
